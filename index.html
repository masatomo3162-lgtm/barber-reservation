<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理容室予約管理</title>
    <link rel="stylesheet" href="css/style.css">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
</head>
<body>
    <header>
        <h1>理容室予約管理</h1>
        <nav>
            <button onclick="showSection('calendar')">予約状況</button>
            <button onclick="showSection('customers')">顧客管理</button>
            <button onclick="showSection('settings')">設定・出力</button>
        </nav>
    </header>

    <main>
        <!-- 予約状況セクション -->
        <section id="calendar" class="active">
            <div id="calendar-view"></div>
            <div id="day-view" style="display:none;">
                <button onclick="backToCalendar()">← カレンダーに戻る</button>
                <h2 id="selected-date-display"></h2>
                <div class="controls">
                    <button onclick="openReservationModal()">新規予約</button>
                    <button onclick="openCustomerModal()">新規顧客登録</button>
                </div>
                <div id="drag-time-indicator" style="display:none; position:absolute; background:rgba(0,0,0,0.7); color:white; padding:2px 5px; border-radius:3px; z-index:100; pointer-events:none; font-size:12px;"></div>
                <div id="reservation-timeline" style="position:relative; height: 1200px; background: #eee; border: 1px solid #ccc; margin-top: 20px;">
                    <!-- タイムラインがここに表示される -->
                </div>
            </div>
        </section>

        <!-- 顧客管理セクション -->
        <section id="customers">
            <h2>顧客管理</h2>
            <div class="controls">
                <input type="text" id="customer-search" placeholder="名前で検索...">
                <button onclick="openCustomerModal()">新規顧客登録</button>
            </div>
            <table id="customer-table">
                <thead>
                    <tr>
                        <th>名前</th>
                        <th>電話番号</th>
                        <th>最終来店日</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="customer-list">
                    <!-- 顧客リストがここに表示される -->
                </tbody>
            </table>
        </section>

        <!-- 設定・出力セクション -->
        <section id="settings">
            <h2>設定・バックアップ</h2>
            <div class="card">
                <h3>データバックアップ</h3>
                <p>現在のデータをCSV形式で書き出します。iCloud Drive等に保存してください。</p>
                <button onclick="exportToCSV()">CSVエクスポート</button>
            </div>
            <div class="card">
                <h3>施術メニュー設定（確認用）</h3>
                <ul>
                    <li>カット: 25分</li>
                    <li>シェービング: 15分</li>
                    <li>シャンプー: 15分</li>
                    <li>カラーリング: 60分</li>
                    <li>パーマ: 90分</li>
                    <li>インターバル: 5分</li>
                </ul>
            </div>
        </section>
    </main>

    <!-- 予約登録モーダル -->
    <div id="reservation-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('reservation-modal')">&times;</span>
            <h3>新規予約登録</h3>
            <form id="reservation-form">
                <div class="form-group">
                    <label>顧客選択:</label>
                    <select id="res-customer-id" required></select>
                </div>
                <div class="form-group">
                    <label>開始時間:</label>
                    <input type="time" id="res-start-time" required>
                </div>
                <div class="form-group">
                    <label>メニュー（複数選択可）:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="menu" value="cut" data-time="25"> カット (25分)</label>
                        <label><input type="checkbox" name="menu" value="shaving" data-time="15"> シェービング (15分)</label>
                        <label><input type="checkbox" name="menu" value="shampoo" data-time="15"> シャンプー (15分)</label>
                        <label><input type="checkbox" name="menu" value="color" data-time="60"> カラーリング (60分)</label>
                        <label><input type="checkbox" name="menu" value="perm" data-time="90"> パーマ (90分)</label>
                        <label><input type="checkbox" name="menu" value="ear" data-time="10"> 耳掃除 (10分)</label>
                        <label><input type="checkbox" name="menu" value="grey" data-time="20"> 白髪ぼかし (20分)</label>
                        <label><input type="checkbox" name="menu" value="w_cut" data-time="25"> 女性カット (25分)</label>
                        <label><input type="checkbox" name="menu" value="w_shave" data-time="30"> 女性顔そり (30分)</label>
                        <label><input type="checkbox" name="menu" value="straight" data-time="180"> 縮毛矯正 (180分)</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>料金 (円):</label>
                    <input type="number" id="res-price" placeholder="0">
                </div>
                <div class="form-group">
                    <label>表示カラー:</label>
                    <input type="color" id="res-color" value="#e67e22">
                </div>
                <input type="hidden" id="res-id">
                <div class="form-group">
                    <label>合計時間: <span id="res-total-time">0</span> 分 (+ 5分休憩)</label>
                </div>
                <button type="submit">予約を保存</button>
            </form>
        </div>
    </div>

    <!-- 顧客登録モーダル -->
    <div id="customer-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('customer-modal')">&times;</span>
            <h3>顧客登録</h3>
            <form id="customer-form">
                <div class="form-group">
                    <label>名前:</label>
                    <input type="text" id="cust-name" required>
                </div>
                <div class="form-group">
                    <label>電話番号:</label>
                    <input type="tel" id="cust-phone">
                </div>
                <div class="form-group">
                    <label>メモ:</label>
                    <textarea id="cust-note"></textarea>
                </div>
                <button type="submit">登録</button>
            </form>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
